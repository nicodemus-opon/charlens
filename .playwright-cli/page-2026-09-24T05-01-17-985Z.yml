            - separator [ref=f3e924]
            - heading "Page 18" [level=4] [ref=f3e925]
            - generic [ref=f3e927]:
              - generic [ref=f3e931]:
                - paragraph [ref=f3e932]:
                  - text: 作者：厉佩逾来源：
                  - link "解放军报客户端" [ref=f3e934] [cursor=pointer]:
                    - /url: ../../../
                  - text: 发布时间：2019-07-10 16:20:18
                - generic [ref=f3e935]:
                  - text: 浙江省军区公开招考文职人员面试现场。
                  - paragraph [ref=f3e937]: 7月8至10日，浙江省军区依托浙江工商大学人民武装学院，严密组织面向社会公开招考文职人员面试工作。前期，经军队招考文职人员统一考试，498名考生笔试入围，经资格审查、体格检查等层层把关，共299名对象入围参加面试，涉及医疗、护理、工程、会计以及人武部、干休所管理等120多个岗位。
                  - paragraph [ref=f3e938]: 此次招考文职人员工作事关军队建设长远发展和人才资源队伍优化，社会关注度高、工作敏感性强，延揽人才意义深远。省军区党委高度重视，主要领导亲自审定工作方案，从各级和驻地体系医院遴选责任心强、公道正派、专业素养好的高中级专业技术专家和文职人员管理干部担任面试考官，全面考察报考人员求职动机、适岗能力和专业素质。
                  - paragraph [ref=f3e939]:
                    - strong [ref=f3e940]: 考前考务培训：严阵以待 精心筹划
                  - paragraph [ref=f3e942]: 为确保面试全程严谨规范、公开透明，7月7日，省军区严密组织考务人员培训会和考官碰头会，明确抽签抽题流程、演练计时计分方法、模拟应考应答场景、安排外围场地警戒。
                  - paragraph [ref=f3e943]: 在模拟考场过程中，考官及考务人员认真听取讲解员的流程指导，积极提出疑问，现场讨论热烈，灵活改进方法，为面试工作顺利展开做好各项准备。
                  - paragraph [ref=f3e944]: 笔者还注意到，在大厅的投诉受理处摆放着廉政监督卡，卡片上列有详细的监督举报方式。
                  - paragraph [ref=f3e946]:
                    - strong [ref=f3e947]: 直击面试现场：严肃认真 井然有序
                  - paragraph [ref=f3e948]: 此次面试主要采取现场答辩、情况处置和实际操作等方式进行。考生通过现场资格审核，在待考室抽签确定面试顺序，随机抽取考题，以现场演示的方式进行情况处置，经考核组综合评定后现场公布面试成绩；考场分别设置候考室、面试室、休息室，各功能室完全隔离，避免候考人员、考务人员以及面试结束人员接触。
                  - paragraph [ref=f3e950]: 面试期间，重要场所入口均设置有警备纠察人员，每个考场配备监督员、计分员、引导员、计时员，电子信号屏蔽装置、录音录像设备均处于开启状态，监督员现场实时受理和处置考生的咨询投诉、申诉举报。
                  - paragraph [ref=f3e951]: 面试第二天，天公不作美，彻雨连绵。但是考生们依旧风雨无阻，早早赶到考场。所有人都沉浸在紧张肃穆的考试氛围中，或眉头紧锁、或神色镇定……许多走出考场的考生面带喜色、胸有成竹。
                  - paragraph [ref=f3e952]:
                    - strong [ref=f3e953]: 现场检查督导：严字当头 确保公正
                  - paragraph [ref=f3e954]: 面试期间，省军区专门抽调纪检人员组成精干小组，对面试工作进行全程监督，督导小组对面试各点位工作情况进行全面检查，确保面试工作经得起检验。
                  - paragraph [ref=f3e956]: 在候考室，省军区首长亲切问询应聘人员报考动机，毕业于浙江农林大学的一名考生说道，“我从小就向往部队生活，梦想成为一名军人，但因为身体条件不达标没能如愿。这次招考给了我第二次机会，虽然文职人员不穿军装，但也是军队的一份子，也算圆了我携笔从戎的军旅梦，希望自己能面试成功。”
                  - paragraph [ref=f3e957]: 面试工作流程规范、组织严密、把关严格，让考生充分感受到了军队作风的严谨、务实和高效，文职考试的公平、公开和公正。
