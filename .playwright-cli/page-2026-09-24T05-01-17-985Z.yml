            - heading "Page 17" [level=4] [ref=f3e879]
            - generic [ref=f3e881]:
              - generic [ref=f3e885]:
                - paragraph [ref=f3e886]:
                  - text: 作者：曲忠刚 陈俊峰来源：
                  - link "中国军网" [ref=f3e888] [cursor=pointer]:
                    - /url: ../../../
                  - text: 发布时间：2022-04-12 15:54:16
                - generic [ref=f3e889]:
                  - paragraph [ref=f3e891]: 单兵战术场地，随着一声令下，参赛人员迅速卧倒，匍匐通过铁丝网，扬起阵阵黄沙；射击训练场地，指挥员一声令下，参赛选手屏气凝神，清脆的枪声响彻靶场……3月底，晋城市民兵综合训练基地，一场文职人员军事素质考核比武正如火如荼展开。
                  - paragraph [ref=f3e893]: “识图用图、自动步枪操作、战术基础动作等8个课目连贯组织实施，感觉好像上了战场一样！”刚刚走下比武场，沁水县人武部政工科文职干事牛浩然擦了擦额头的汗水，感慨地说。
                  - paragraph [ref=f3e895]: 年初以来，晋城军分区党委坚决贯彻落实习主席开训动员令要求，始终把军事训练作为党委第一要务、主官第一责任、官兵第一能力，严格按照军事训练大纲要求和标准，重点突出指挥技能、基础体能等内容，组织全区文职人员开展为期一个月的强化集训，并确立“以赛促训、实训实练”的思路，将群众性比武竞赛作为提高训练水平的重要举措。比武场上，来自6个县（市、区）人武部的33名文职人员同台竞技，展开激烈角逐。
                  - paragraph [ref=f3e898]: “仗怎么打，兵就怎么练。我们这次集训紧紧围‘五个基本’，突出学理论、练体能、强技能，就是要努力提升文职人员与本职岗位相匹配的军事素养，切实练就与职责使命相适应的过硬本领。”军分区战备建设处参谋程然然向笔者介绍。
                  - paragraph [ref=f3e899]: “只有熟练掌握手中武器装备，把军事技能练精练强，才能拿到未来战场上的‘入场券’。”来自阳城县人武部的李江峰，去年刚刚走出“象牙塔”成为文职方阵中的一员，这次集训中他凭借轻武器射击、识图用图两项第一，以及军事理论、战术基础动作两项第二的成绩，在众多选手中脱颖而出。
                  - paragraph [ref=f3e901]: 经过集训严格砺练，所有参训人员都将成为“火种”，把不畏艰苦、敢打敢拼的集训队精神运用到日常工作中。“这次集训不是为了示范作业，而是要示教作业，让这批文职人员成为点燃练兵备战热情的‘星星之火’。”军分区战备建设处处长曲忠刚说。
                  - paragraph [ref=f3e903]: 比武结束后，晋城军分区第一时间召开复盘检讨会，认真剖析集训和比武中暴露出的问题短板，制定对策措施，强化练兵实效，助力全区官兵练兵备战水平再上新台阶。
