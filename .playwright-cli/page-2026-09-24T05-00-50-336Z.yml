          - link "工作 工作动态 - 军队人才网 Sep 7 4 min 2026-2027年度军事科学院直接选拔招录军官公告 >>>>>>>> 作者：来源：军队人才网发布时间：2026-09-07 17:40:37 根据《现役军官选拔补充暂行规定》等有关政策，按照全军统一部署，现就军事科学院2026-2027年度直接选拔招录军官有关事项公告如下： 一、单位概况 军事科学院是中央军委直接领导的军事科研机构，是开展军事理论和军事科技创新研究的重要力量，是党中央确定的首批国家高端智库建设单位，拥有一大批在国内外享有盛誉的院士专家，一大批处于全国全军领先地位的科研试验平台，一大批具有特色优势的战略性、前沿性、基础性创新成果，为推进国防和军队建设发挥了重要支撑作用。 二、招录岗位 主要是科研单位专业技术军官岗位，专业方向主要包括政治学、法学、人工智能、计算机科学与技术、控制科学与工程、力学、生物学、药学、临床医学、核科学与技术、化学、建筑学、物理学、数学、航空宇航科学与技术、船舶与海洋工程、机械工程、飞行器设计等专业。 三、招录对象 招录对象为2025年12月至2027年6月毕业的应届毕业生。主要从首批“双一流”建设高校（世界一流大学建设高校A类36所、B类6所）和第二批“双一流”建设学科应届毕业生中选拔，以及QS世界排名前200 New 81rc http page page" [ref=f3e68] [cursor=pointer]:
