          - link "工作 工作动态 - 军队人才网 Sep 7 5 min 2026-2027年度63650部队直接选拔招录军官公告 >>>>>>>> 作者：来源：军队人才网发布时间：2026-09-07 17:40:37 一、单位简介 中国人民解放军63650部队，是一支光荣而传奇的部队。这里承载了革命先辈干惊天动地事的精神；这里挺起了国家和民族的脊梁；这里诞生了无数感动全国的故事。单位分布在北京、西安、洛阳、新疆等地，设有国家级重点实验室、博士后科研工作站。所属单位先后为国家培养出多名院士。我们诚挚的邀请优秀的你加入我们！ 二、职业前景 部队有完备的人才培养体系，包括岗前培训、岗位培训、专业培训、晋升教育和学历教育等。每年安排军官参加军队和地方高校的业务培训，鼓励军官在全军高校和地方高校继续进修提升学历。此外，还有到国外军事院校交流学习的机会，给每名同志提供广阔的发展平台。 三、招录对象 主要从首批“双一流”建设高校（世界一流大学建设高校A类36所、B类6所）和第二批“双一流”建设学科应届毕业生中选拔（2025年12月至2027年6月毕业）。所有招录对象本科学历应为第一批次录取(高考成绩、毕业院校专业录取分数线均不低于参加高考省份当年一本线或者特殊类型招生控制线)；根据需要，可择优招录QS世界排名前200名国（境）外高校应届 New 81rc http page page" [ref=f3e117] [cursor=pointer]:
