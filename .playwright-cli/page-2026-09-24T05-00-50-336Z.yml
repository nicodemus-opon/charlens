          - link "工作 工作动态 - 军队人才网 Sep 7 5 min 2026-2027年度国防大学直接选拔招录军官公告 >>>>>>>> 作者：来源：军队人才网发布时间：2026-09-07 17:40:37 根据《现役军官选拔补充暂行规定》等有关政策，按照全军统一部署，2026-2027年度国防大学直接选拔招录军官工作将全面展开。现将有关事项公告如下： 一、国防大学概况 国防大学植根于红色井冈，传承红大、抗大血脉，沿着人民军队不断壮大的足迹一路前行，为党、国家、军队培养输送了大批优秀人才。2017年7月19日，是一个载入国防大学史册的日子，习近平主席亲自为国防大学授军旗、致训词。新时代的国防大学承担着高级指挥员晋升教育、联合作战指挥人才和战略管理人才任职培训、军事学研究生教育、外军军官培训等重大任务，担负着研究阐释、教育传播习近平新时代中国特色社会主义思想的重要使命，突出研究军事、研究战争、研究打仗，揭示现代战争制胜机理，探寻胜战打赢之策。 作为我国最高军事学府和全军唯一的综合性联合指挥大学，是锤炼高中级领导干部党性作风的重要熔炉，是培养联合作战人才和高中级领导干部的重要基地，是创新发展军事理论的重要高地，是学习研究宣传党的创新理论、发展新时代强军文化的重要阵地，是培训外国高级军官和防务官员、开展国际军事交流合作 New page page" [ref=f3e85] [cursor=pointer]:
