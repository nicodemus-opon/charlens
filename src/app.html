<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="charlens — self-hosted, multi-user RSS reader. Follow your feeds, read and save articles on any device."
		/>
		<meta name="theme-color" content="#fff8fb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
		<meta name="text-scale" content="scale" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="charlens" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="format-detection" content="telephone=no" />
		<script>
			// Pre-paint theme-color: resolve the mode the way ModeWatcher will
			// (stored preference, else the system one) and apply it to every
			// theme-color meta. The light meta comes first so UAs that don't
			// understand `media` fall back to the previous single-meta color.
			// ModeWatcher's themeColors prop stays unused on purpose: its injected
			// head script updates only the first meta and treats "system" as dark.
			(() => {
				const metas = document.querySelectorAll('meta[name="theme-color"]');
				if (!metas.length) return;
				let mode = null;
				try {
					mode = localStorage.getItem('mode-watcher-mode');
				} catch {
					/* storage unavailable */
				}
				const dark =
					mode === 'dark' ||
					(mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				const content = dark ? '#262624' : '#fff8fb';
				for (const meta of metas) meta.setAttribute('content', content);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
